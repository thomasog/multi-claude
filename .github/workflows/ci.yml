name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}   # steps can't use matrix in their own shell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 6) { Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null }
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
          $issues = 'install.ps1', 'src', 'tests' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 }
          $issues | Format-Table -AutoSize
          # Windows PowerShell 5.1 reads BOM-less files as ANSI: keep every .ps1 ASCII.
          $nonAscii = Get-ChildItem -Recurse -Filter *.ps1 | Where-Object { [IO.File]::ReadAllBytes($_.FullName) -gt 127 }
          if ($nonAscii) { "Non-ASCII: $($nonAscii.FullName -join ', ')" }
          if ($issues -or $nonAscii) { exit 1 }
      - name: Test
        run: .\tests\windows.tests.ps1
      - name: Installer interop in a fresh process
        run: .\tests\windows-interop.tests.ps1 -EntryPoint Installer
      - name: CLI interop in a fresh process
        run: .\tests\windows-interop.tests.ps1 -EntryPoint Cli
      - name: Install from this checkout, then uninstall
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'mc-home'
          New-Item -ItemType Directory $env:USERPROFILE -Force | Out-Null
          $shell = (Get-Process -Id $PID).Path
          cmd /d /c "echo.| `"$shell`" -NoProfile -ExecutionPolicy Bypass -File install.ps1"
          $bin = Join-Path $env:USERPROFILE '.multi-claude\bin'; $mc = Join-Path $bin 'multi-claude.cmd'
          # The stored PATH, unexpanded: expanding %USERPROFILE% would point other entries at the fake home.
          $onPath = { (Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames') -split ';' | Where-Object { $_.TrimEnd('\') -eq $bin } }
          & $mc help; if ($LASTEXITCODE) { exit 1 }
          if (-not (& $onPath)) { throw 'bin is not on the user PATH' }
          & $mc uninstall; if ($LASTEXITCODE) { exit 1 }
          Start-Sleep -Seconds 8
          if (Test-Path (Join-Path $env:USERPROFILE '.multi-claude')) { throw '.multi-claude is still there' }
          if (& $onPath) { throw 'bin is still on the user PATH' }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: zsh tests/macos.sh
      - name: Install from this checkout, then uninstall
        run: |
          ./install.sh </dev/null
          ~/.local/bin/multi-claude help
          ~/.local/bin/multi-claude uninstall
          test ! -e ~/.local/bin/multi-claude

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint
        run: |
          shellcheck install.sh src/linux/multi-claude tests/linux.sh
          pipx run ruff==0.17.0 check .
      - name: Test
        run: |
          python3 -m unittest discover -s tests -v
          bash tests/linux.sh
      - name: Install from this checkout, then uninstall
        run: |
          ./install.sh </dev/null
          ~/.local/bin/multi-claude help
          ~/.local/bin/multi-claude uninstall
          test ! -e ~/.local/bin/multi-claude
