name: Release

# Push a tag like v0.1.0 from main. The tests run, the installers are stamped with the version and the
# archives' SHA-256, and everything is published with build provenance.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on main and matches the version everywhere
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::The tag is not on main."; exit 1; }
          v=${GITHUB_REF_NAME#v}
          tr -d '\r' < src/windows/multi-claude.ps1 | grep -q "^\$Version = '$v'$"
          grep -q "^VERSION=$v$" src/macos/multi-claude
          grep -q "^VERSION=$v$" src/linux/multi-claude
          grep -q "^## \[$v\]" CHANGELOG.md

      - name: Build archives and stamp the installers
        run: |
          mkdir dist
          zip -qr dist/multi-claude.zip src LICENSE README.md
          tar -czf dist/multi-claude.tar.gz src LICENSE README.md
          zip_sha=$(sha256sum dist/multi-claude.zip | cut -d' ' -f1)
          tar_sha=$(sha256sum dist/multi-claude.tar.gz | cut -d' ' -f1)
          sed -e "s/__VERSION__/$GITHUB_REF_NAME/" -e "s/__SHA256__/${zip_sha^^}/" install.ps1 > dist/install.ps1
          sed -e "s/__VERSION__/$GITHUB_REF_NAME/" -e "s/__SHA256__/$tar_sha/" install.sh > dist/install.sh
          (cd dist && sha256sum multi-claude.zip multi-claude.tar.gz install.ps1 install.sh > SHA256SUMS)

      # Release pages keep single line breaks, so wrapped list items are joined back into one line.
      - name: Release notes from the changelog
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## [" v "]") == 1 {on=1; next} /^## \[|^\[.*\]: / {on=0} on' CHANGELOG.md |
            awk '/^ +[^ ]/ && n {sub(/^ +/, ""); line[n] = line[n] " " $0; next} {line[++n] = $0} END {for (i = 1; i <= n; i++) print line[i]}' > notes.md

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      # A draft first, published only once every file is attached, so /releases/latest never points
      # at a release whose files are still uploading or failed to upload.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
          expected=$(ls dist | LC_ALL=C sort | tr '\n' ' ')   # byte order, as jq sorts
          attached=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | sort | join(" ")')
          if [ "$attached " != "$expected" ]; then echo "Attached: $attached; expected: $expected"; exit 1; fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
